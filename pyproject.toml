[project]
name = "docshound"
version = "0.1.0"
description = "DocsHound turns GitHub issues and merged pull requests into citeable documentation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
